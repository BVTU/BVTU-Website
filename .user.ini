; Error handling for the live site.
;
; Nothing set this, so the host's default applied and PHP printed notices
; straight into the page — a member looking at Documents saw
;   Notice: Undefined variable: loggedIn in /home/u.../public_html/new/documents.php
; above the menu. Two problems with that: it looks broken, and it publishes the
; server's absolute path, which is the kind of detail you hand an attacker for
; free.
;
; Errors are still recorded — they go to the host's PHP error log, readable from
; hPanel — they are just not shown to visitors. To see them on screen while
; working on something, set BVTU_DEBUG in members/config.php rather than changing
; this file, so the live site cannot be left talking to the public.

display_errors         = Off
display_startup_errors = Off
log_errors             = On
error_reporting        = E_ALL
